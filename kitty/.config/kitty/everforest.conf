# vim:ft=kitty
## name:     Everforest Kitty Dark Medium
## author:   Sainnhe Park
## license:  MIT
## upstream: https://github.com/sainnhe/everforest/blob/master/palette.md
## blurb:    Comfortable & pleasant green-based color scheme for the high-spirited!

# The basic colors
foreground              #D3C6AA
background              #2D353B
selection_foreground    #2D353B
selection_background    #D3C6AA

# Cursor colors
cursor                  #D3C6AA
cursor_text_color       #2D353B

# Scrollbar colors
scrollbar_handle_color  #859289
scrollbar_track_color   #343F44

# URL color when hovering with mouse
url_color               #7FBBB3

# Kitty window border colors
active_border_color     #A7C080
inactive_border_color   #475258
bell_border_color       #DBBC7F

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #2D353B
active_tab_background   #A7C080
inactive_tab_foreground #D3C6AA
inactive_tab_background #232A2E
tab_bar_background      #232A2E

# Colors for marks (marked text in the terminal)
mark1_foreground #2D353B
mark1_background #A7C080
mark2_foreground #2D353B
mark2_background #D699B6
mark3_foreground #2D353B
mark3_background #7FBBB3

# The 16 terminal colors

# black
color0 #343F44
color8 #475258

# red
color1 #E67E80
color9 #E67E80

# green
color2  #A7C080
color10 #A7C080

# yellow
color3  #DBBC7F
color11 #DBBC7F

# blue
color4  #7FBBB3
color12 #7FBBB3

# magenta
color5  #D699B6
color13 #D699B6

# cyan
color6  #83C092
color14 #83C092

# white
color7  #9DA9A0
color15 #859289
