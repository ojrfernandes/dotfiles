######################################################
################## EVERFOREST THEME ##################
######################################################


"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bg1)\
$os\
$username\
[](fg:bg1 bg:orange)\
$directory\
[](fg:orange bg:green)\
$git_branch\
$git_status\
[](fg:green bg:blue)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:blue bg:purple)\
$docker_context\
[](fg:purple bg:red)\
$time\
[ ](fg:red)\
$line_break$character"""

palette = "everforest"
 
[palettes.everforest]
bg-dim   = "#232A2E"
bg0      = "#2D353B"
bg1      = "#343F44"
bg2      = "#3D484D"
bg3      = "#475258"
bg4      = "#4F585E"
bg5      = "#56635F"
fg       = "#D3C6AA"
red      = "#E67E80"
orange   = "#E69875"
yellow   = "#DBBC7F"
green    = "#A7C080"
aqua     = "#83C092"
blue     = "#7FBBB3"
purple   = "#D699B6"
grey0    = "#7A8478"
grey1    = "#859289"
grey2    = "#9DA9A0"
 

[os]
disabled = false
style = "bg:bg1"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:bg1"
style_root = "bg:bg1"
format = '[ $user ]($style)'

[directory]
style = "bg:orange fg:bg1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:aqua"
format = '[[ $symbol $branch ](fg:bg0 bg:green)]($style)'

[git_status]
style = "bg:aqua"
format = '[[($all_status$ahead_behind )](fg:bg0 bg:green)]($style)'

[nodejs]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[c]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[rust]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[golang]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[php]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[java]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[kotlin]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[haskell]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[python]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:bg0 bg:blue)]($style)'

[docker_context]
symbol = ""
style = "bg:current-line"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:orange"
format = '[[  $time ](fg:bg0 bg:red)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:red)'
vimcmd_replace_symbol = '[](bold fg:red)'
vimcmd_visual_symbol = '[](bold fg:purple)'




